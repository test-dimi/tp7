name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.88.0
  BIN_NAME: tp7

jobs:
  verify:
    name: Verify build
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache target directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Build check
        run: cargo check

      - name: Clippy lint
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: CLI smoke
        run: cargo run -- --help

  build:
    name: Build macOS binaries
    needs: verify
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Add compilation targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binaries
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "${target}"
          done

      - name: Prepare dist artifacts
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "${VERSION}" || "${VERSION}" == "${GITHUB_REF_NAME}" ]]; then
            echo "Version could not be derived from tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          MANIFEST_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "${MANIFEST_VERSION}" != "${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${MANIFEST_VERSION}" >&2
            exit 1
          fi

          mkdir -p dist

          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            ARCHIVE_NAME="${BIN_NAME}-${VERSION}-${target}"
            DIST_ROOT="dist/${ARCHIVE_NAME}"
            mkdir -p "${DIST_ROOT}/bin"

            cp "target/${target}/release/${BIN_NAME}" "${DIST_ROOT}/bin/"
            chmod 755 "${DIST_ROOT}/bin/${BIN_NAME}"
            cp README.md "${DIST_ROOT}/"
            cp LICENSE "${DIST_ROOT}/"

            tar -czf "dist/${ARCHIVE_NAME}.tar.gz" -C dist "${ARCHIVE_NAME}"
            shasum -a 256 "dist/${ARCHIVE_NAME}.tar.gz" | awk '{print $1}' > "dist/${ARCHIVE_NAME}.sha256"

            rm -rf "${DIST_ROOT}"
          done

          echo "archive_prefix=${BIN_NAME}-${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.archive_prefix }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.vars.outputs.version }}
      arm_url: ${{ steps.metadata.outputs.arm_url }}
      arm_sha: ${{ steps.metadata.outputs.arm_sha }}
      intel_url: ${{ steps.metadata.outputs.intel_url }}
      intel_sha: ${{ steps.metadata.outputs.intel_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine version
        id: vars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "${VERSION}" || "${VERSION}" == "${GITHUB_REF_NAME}" ]]; then
            echo "Release workflow must be triggered from a tag that starts with v" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Collect artifact metadata
        id: metadata
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          REPOSITORY="${GITHUB_REPOSITORY}"

          arm_url=""
          arm_sha=""
          intel_url=""
          intel_sha=""

          for archive in dist/*.tar.gz; do
            filename="$(basename "${archive}")"
            checksum="$(shasum -a 256 "${archive}" | awk '{print $1}')"
            url="https://github.com/${REPOSITORY}/releases/download/${TAG_NAME}/${filename}"

            if [[ "${filename}" == *"aarch64-apple-darwin.tar.gz" ]]; then
              arm_url="${url}"
              arm_sha="${checksum}"
            elif [[ "${filename}" == *"x86_64-apple-darwin.tar.gz" ]]; then
              intel_url="${url}"
              intel_sha="${checksum}"
            fi
          done

          if [[ -z "${arm_url}" || -z "${intel_url}" ]]; then
            echo "Missing expected macOS artifacts in dist/ directory" >&2
            exit 1
          fi

          echo "arm_url=${arm_url}" >> "${GITHUB_OUTPUT}"
          echo "arm_sha=${arm_sha}" >> "${GITHUB_OUTPUT}"
          echo "intel_url=${intel_url}" >> "${GITHUB_OUTPUT}"
          echo "intel_sha=${intel_sha}" >> "${GITHUB_OUTPUT}"

      - name: Write release notes
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          ARM_URL: ${{ steps.metadata.outputs.arm_url }}
          ARM_SHA: ${{ steps.metadata.outputs.arm_sha }}
          INTEL_URL: ${{ steps.metadata.outputs.intel_url }}
          INTEL_SHA: ${{ steps.metadata.outputs.intel_sha }}
        run: |
          set -euo pipefail
          ./scripts/write-release-notes.sh release-notes.md "${VERSION}" "${ARM_URL}" "${ARM_SHA}" "${INTEL_URL}" "${INTEL_SHA}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
          tag_name: ${{ github.ref_name }}
          name: tp7 ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    # Runs apart from the release job: this job holds the tap token and uses no
    # third-party actions, and the release job never sees the token.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Update Homebrew tap
        env:
          TAP_REPO: totocaster/homebrew-tap
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          ARM_URL: ${{ needs.release.outputs.arm_url }}
          ARM_SHA: ${{ needs.release.outputs.arm_sha }}
          INTEL_URL: ${{ needs.release.outputs.intel_url }}
          INTEL_SHA: ${{ needs.release.outputs.intel_sha }}
        run: |
          set -euo pipefail

          if [[ -z "${TAP_TOKEN:-}" ]]; then
            echo "The HOMEBREW_TAP_TOKEN secret must be configured to push updates to ${TAP_REPO}" >&2
            exit 1
          fi

          WORKDIR="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" "${WORKDIR}"

          ./scripts/update-homebrew-tap.sh "${WORKDIR}" "${VERSION}" "${ARM_URL}" "${ARM_SHA}" "${INTEL_URL}" "${INTEL_SHA}"

          pushd "${WORKDIR}" >/dev/null
          if git status --porcelain | grep .; then
            git config user.name "tp7-bot"
            git config user.email "tp7-bot@users.noreply.github.com"
            git add Formula/tp7.rb
            git commit -m "chore: release tp7 v${VERSION}"
            git push origin HEAD:main
          else
            echo "No tap changes detected; skipping push."
          fi
          popd >/dev/null
